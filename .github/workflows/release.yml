name: Build release binaries
# Builds macOS / Linux / Windows binaries. Publish a Release (or use "Run workflow") to trigger.

# Builds heliograph for macOS, Linux and Windows and attaches the artifacts to a GitHub Release.
# Trigger: create/publish a Release in the GitHub UI (or run manually via "Run workflow").
#
# NOTE: openFrameworks must be downloaded per-platform to build against it. The download URLs and
# the exact package names are pinned below — if a build can't find openFrameworks, verify the
# filename at https://openframeworks.cc/download/ and update OF_*_URL.

on:
  release:
    types: [published]
  workflow_dispatch: {}        # lets you test the build without cutting a release
  # TEMPORARY (CI debugging): build on pushes that touch the workflow or the app, so fixes can be
  # verified without a token that has workflow-dispatch scope. Remove before/after the release is green.
  push:
    branches: [trunk]
    paths: ['.github/workflows/release.yml', 'app/**']

permissions:
  contents: write              # needed to upload assets to the release

env:
  OF_VERSION: "0.12.1"
  # openFrameworks 0.12.1 releases are hosted on GitHub. macOS + Linux are .tar.gz; Windows (VS) is .zip.
  OF_OSX_URL:   "https://github.com/openframeworks/openFrameworks/releases/download/0.12.1/of_v0.12.1_osx_release.tar.gz"
  OF_LINUX_URL: "https://github.com/openframeworks/openFrameworks/releases/download/0.12.1/of_v0.12.1_linux64_gcc6_release.tar.gz"
  OF_WIN_URL:   "https://github.com/openframeworks/openFrameworks/releases/download/0.12.1/of_v0.12.1_vs_64_release.zip"

jobs:
  # ---------------------------------------------------------------- macOS ----
  macos:
    runs-on: macos-latest        # arm64. For an Intel build, add a second job on macos-13.
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - name: Download openFrameworks
        run: |
          curl -L -o of.tgz "$OF_OSX_URL"
          mkdir of && tar xzf of.tgz -C of
          echo "OF_DIR=$PWD/of/$(ls of)" >> "$GITHUB_ENV"

      - name: Place project in OF/apps/myApps/heliograph
        run: |
          mkdir -p "$OF_DIR/apps/myApps/heliograph"
          cp -R repo/app/. "$OF_DIR/apps/myApps/heliograph/"

      - name: Point OF_PATH at the CI openFrameworks
        run: |
          cd "$OF_DIR/apps/myApps/heliograph"
          sed -i '' "s|/Users/ishi/Development/openFrameworks|$OF_DIR|g" Project.xcconfig

      - name: Build (Release)
        run: |
          cd "$OF_DIR/apps/myApps/heliograph"
          xcodebuild -project heliograph.xcodeproj -target heliograph -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build

      - name: Bundle data + ad-hoc sign (self-contained .app)
        run: |
          APP="$OF_DIR/apps/myApps/heliograph/bin/heliograph.app"
          rm -rf "$APP/Contents/Resources/data"
          cp -R "$OF_DIR/apps/myApps/heliograph/bin/data" "$APP/Contents/Resources/data"
          codesign --force --deep --sign - "$APP" || true

      - name: Package
        run: |
          cd "$OF_DIR/apps/myApps/heliograph/bin"
          ditto -c -k --keepParent heliograph.app "$GITHUB_WORKSPACE/heliograph-macos.zip"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: { files: heliograph-macos.zip }
      - uses: actions/upload-artifact@v4
        with: { name: heliograph-macos, path: heliograph-macos.zip }

  # ---------------------------------------------------------------- Linux ----
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - name: Download openFrameworks
        run: |
          curl -L -o of.tar.gz "$OF_LINUX_URL"
          mkdir of && tar -xzf of.tar.gz -C of
          echo "OF_DIR=$PWD/of/$(ls of)" >> "$GITHUB_ENV"

      - name: Install openFrameworks dependencies
        run: |
          cd "$OF_DIR/scripts/linux/ubuntu"
          sudo ./install_dependencies.sh -y || sudo ./install_dependencies.sh

      - name: Place project in OF/apps/myApps/heliograph
        run: |
          mkdir -p "$OF_DIR/apps/myApps/heliograph"
          cp -R repo/app/. "$OF_DIR/apps/myApps/heliograph/"

      - name: Build (Release)
        run: |
          cd "$OF_DIR/apps/myApps/heliograph"
          # committed Makefile/config.make use the default OF_ROOT=../../.. which is correct for this layout
          make -j"$(nproc)" Release

      - name: Package (binary + data side by side)
        run: |
          cd "$OF_DIR/apps/myApps/heliograph"
          mkdir -p out/heliograph
          cp bin/heliograph out/heliograph/
          cp -R bin/data    out/heliograph/data
          cd out && tar -czf "$GITHUB_WORKSPACE/heliograph-linux.tar.gz" heliograph

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: { files: heliograph-linux.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: heliograph-linux, path: heliograph-linux.tar.gz }

  # -------------------------------------------------------------- Windows ----
  # Most fragile of the three — Windows needs the VS project generated by projectGenerator.
  # Verify the generated .sln name / projectGenerator path on the first run.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - name: Download openFrameworks
        shell: pwsh
        run: |
          curl.exe -L -o of.zip "$env:OF_WIN_URL"
          mkdir of; Expand-Archive of.zip -DestinationPath of
          $dir = (Get-ChildItem of -Directory | Select-Object -First 1).FullName
          "OF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Place project in OF/apps/myApps/heliograph
        shell: pwsh
        run: |
          $dst = "$env:OF_DIR\apps\myApps\heliograph"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force repo\app\* $dst

      - name: Generate the Visual Studio project
        shell: pwsh
        run: |
          $pg = Get-ChildItem "$env:OF_DIR\projectGenerator*" -Recurse -Filter projectGenerator.exe | Select-Object -First 1
          & $pg.FullName -o"$env:OF_DIR" "$env:OF_DIR\apps\myApps\heliograph"

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        shell: pwsh
        run: |
          $sln = Get-ChildItem "$env:OF_DIR\apps\myApps\heliograph" -Filter *.sln | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /m

      - name: Package (exe + dlls + data)
        shell: pwsh
        run: |
          $bin = "$env:OF_DIR\apps\myApps\heliograph\bin"
          Compress-Archive -Path "$bin\*" -DestinationPath "$env:GITHUB_WORKSPACE\heliograph-windows.zip" -Force

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: { files: heliograph-windows.zip }
      - uses: actions/upload-artifact@v4
        with: { name: heliograph-windows, path: heliograph-windows.zip }
